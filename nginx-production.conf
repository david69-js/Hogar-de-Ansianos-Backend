# Servidor web para el despliegue en servidor propio (ver docs/DESPLIEGUE-SERVIDOR-PROPIO.md).
# No se usa en Railway: allá la aplicación se expone directo desde su propio Apache.
#
# Qué hace: termina TLS y reenvía todo al contenedor "app", que es una imagen
# php:8.3-apache. Antes este archivo hablaba FastCGI contra el puerto 9000
# (fastcgi_pass), que es lo que se usa con php-fpm — pero acá no hay php-fpm, así
# que ninguna petición habría funcionado. Y apuntaba a un host interno de Railway,
# que en un servidor propio no existe.

# Redirección a HTTPS. La excepción es el desafío de Let's Encrypt: certbot
# necesita responder por HTTP en esa ruta para emitir y renovar el certificado.
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Certificados. Con Let's Encrypt, montar /etc/letsencrypt del host y apuntar a
    # /etc/nginx/ssl/live/<dominio>/fullchain.pem. Para pruebas sirve un autofirmado
    # (ver la guía de despliegue).
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Tamaño máximo de la petición. Sin esto nginx corta en 1M y rechaza con 413
    # la subida de fotos antes de que PHP la vea; PHP admite hasta 12M (php-uploads.ini).
    client_max_body_size 16M;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Encabezados de seguridad básicos. HSTS queda comentado a propósito: una vez
    # que el navegador lo recuerda, ya no se puede volver a http en ese dominio.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # 8080 es el puerto en el que entrypoint.sh pone a escuchar a Apache
        # dentro del contenedor (PORT, con 8080 por defecto).
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Los reportes en PDF pueden tardar en generarse con periodos largos.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
        proxy_buffering       off;
    }

    # Nunca servir archivos sensibles aunque queden dentro de la raíz pública.
    location ~ /\.(env|git|svn|ht) {
        deny all;
    }
}
