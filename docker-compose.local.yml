services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: laravel-app
    container_name: laravel-sorherminia-app
    restart: unless-stopped
    working_dir: /var/www/sorherminia
    volumes:
      - ./laravel-app:/var/www/sorherminia
    environment:
      # Laravel specific environment variables
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_CHANNEL=stderr
      # Database configuration
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-mysql_sorherminia}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-sorherminia}
      - DB_USERNAME=${DB_USERNAME:-sorherminia_user}
      - DB_PASSWORD=${DB_PASSWORD:-root}
      # En Linux, con bind mount, entrypoint.sh alinea www-data a este UID/GID para
      # que los archivos que el contenedor escribe en storage/bootstrap/cache queden
      # editables/borrables desde el host. En macOS (Docker Desktop) no hace falta,
      # pero no molesta dejarlo. Para tu usuario real: `export HOST_UID=$(id -u)
      # HOST_GID=$(id -g)` antes de `docker compose up`, o defínelos en el .env de
      # la raíz del repo (junto a DB_HOST, DB_PORT, etc).
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
    networks:
      - laravel
    depends_on:
      - db

  scheduler:
    image: laravel-app
    container_name: laravel-sorherminia-scheduler
    restart: unless-stopped
    working_dir: /var/www/sorherminia
    # Se salta entrypoint.sh (que arranca Apache) y corre el scheduler de Laravel
    # directamente: sin este servicio, app:check-pending-medications y
    # app:check-medication-stock nunca se ejecutan solos en el entorno local.
    # Corre como el mismo UID/GID que el host (no por nombre "www-data"): este
    # contenedor no ejecuta entrypoint.sh, así que nunca ve el usermod/groupmod que
    # alinea www-data en el contenedor "app"; sin esto, schedule:work escribiría
    # logs/cache en el volumen compartido con un UID que el host no puede tocar.
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    entrypoint: ["php", "artisan", "schedule:work"]
    volumes:
      - ./laravel-app:/var/www/sorherminia
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - LOG_CHANNEL=stderr
      - DB_CONNECTION=mysql
      - DB_HOST=${DB_HOST:-mysql_sorherminia}
      - DB_PORT=${DB_PORT:-3306}
      - DB_DATABASE=${DB_DATABASE:-sorherminia}
      - DB_USERNAME=${DB_USERNAME:-sorherminia_user}
      - DB_PASSWORD=${DB_PASSWORD:-root}
    networks:
      - laravel
    depends_on:
      - db
      - app

  webserver:
    image: nginx:alpine
    container_name: nginx_sorherminia
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./laravel-app:/var/www/sorherminia
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: mysql_sorherminia
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-sorherminia}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootsorherminia}
      MYSQL_USER: ${DB_USERNAME:-sorherminia_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin_sorherminia
    restart: unless-stopped
    environment:
      PMA_HOST: ${DB_HOST:-mysql_sorherminia}
      PMA_PORT: ${DB_PORT:-3306}
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      - laravel
    depends_on:
      - db

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
