; Límites de subida de archivos.
;
; Por defecto PHP permite solo 2M, y ese era el tope real que frenaba las fotos
; de los residentes: el archivo se rechazaba ANTES de llegar a Laravel, así que
; la validación del controlador (que permitía más) nunca se ejecutaba.
;
; post_max_size va por encima de upload_max_filesize porque el cuerpo del POST
; incluye además los otros campos del formulario. memory_limit sube a 256M
; porque decodificar una foto de 12 MB en memoria (GD trabaja con el mapa de
; bits completo, ~4 bytes por pixel) no cabe en los 128M por defecto.
;
; Las imágenes NO se guardan con ese peso: ImageOptimizer las redimensiona y
; recomprime antes de subirlas a R2.
upload_max_filesize = 12M
post_max_size = 16M
memory_limit = 256M
